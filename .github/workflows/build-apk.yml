name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/keep
            cp -r lib test pubspec.yaml analysis_options.yaml /tmp/keep/
            flutter create --platforms=android --org com.markercreator --project-name marker_creator .
            # flutter create must not replace our sources
            rm -rf lib test
            cp -r /tmp/keep/lib /tmp/keep/test .
            cp /tmp/keep/pubspec.yaml /tmp/keep/analysis_options.yaml .
            sed -i 's/android:label="[^"]*"/android:label="Marker Creator"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Validate APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q AndroidManifest.xml
          unzip -l "$APK" | grep -q classes.dex
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marker-creator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
